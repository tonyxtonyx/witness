version: 1
kind: object
metadata:
  name: abc
  domain: retail
  label: Test object
  description: Test object
  owner: ai_team
  tags: [sales, crm]
spec:
  source: {catalog: postgres, schema: public, table: customers}
  primaryKey: [customer_id]
  dimensions:
    - {name: customer_id, label: Customer ID, type: bigint, sql: customer_id, nullable: false}
    - {name: name, label: Name, type: varchar, sql: name}
    - {name: country, label: Country, type: varchar, sql: country}
    - { name: product_id, label: Product ID, type: bigint, sql: product_id, nullable: false }
  relationships:
    - name: abc_products
      targetObject: products
      sourceFields: [ product_id ]
      targetFields: [ product_id ]
      cardinality: many_to_one
      defaultJoinType: left
